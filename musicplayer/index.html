<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Music Player</title>
<link rel="stylesheet" href="style.css">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#12141c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Music Player">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="7.4" y="6.2" width="1.4" height="12.3"/>
          <rect x="17.9" y="6.2" width="1.4" height="9.8"/>
          <rect x="7.4" y="4" width="11.9" height="2.2"/>
          <circle cx="6.5" cy="18.5" r="2.3"/>
          <circle cx="17" cy="16" r="2.3"/>
        </svg>
        Music Player by クロちゃん
      </h1>
    </header>

    <section class="playlist-section">
      <div class="playlist-header">
        <h2>プレイリスト</h2>
        <span class="playlist-count" id="playlistCount"></span>
      </div>
      <ul class="playlist" id="playlist"></ul>
    </section>

    <div class="mascot-lane" aria-hidden="true">
      <img id="mascotImg" class="mascot" src="assets/mascot/kurochan.png" alt="">
    </div>

    <section class="now-playing">
      <div class="progress-row">
        <span class="time" id="currentTime">0:00</span>
        <input type="range" id="seekBar" class="seek-bar" value="0" min="0" max="100" step="0.1">
        <span class="time" id="duration">0:00</span>
      </div>

      <div class="track-info">
        <div class="track-title" id="trackTitle">曲を選択してください</div>
        <div class="track-index" id="trackIndex">-</div>
      </div>

      <div class="controls">
        <button id="shuffleBtn" class="ctrl-btn toggle-btn" title="シャッフル">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h3l10 12h3"/>
            <path d="M4 18h3l3.5-4.2"/>
            <path d="M14 6h3"/>
            <path d="M17 3l3 3-3 3"/>
            <path d="M17 15h3"/>
            <path d="M17 12l3 3-3 3"/>
          </svg>
        </button>
        <button id="prevBtn" class="ctrl-btn" title="前の曲">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6z"/><path d="M20 6L9 12l11 6z"/></svg>
        </button>
        <button id="playBtn" class="ctrl-btn play-btn" title="再生/一時停止">
          <svg class="icon icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6z"/><path d="M14 5h4v14h-4z"/></svg>
        </button>
        <button id="nextBtn" class="ctrl-btn" title="次の曲">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2z"/><path d="M4 6l11 6-11 6z"/></svg>
        </button>
        <button id="repeatBtn" class="ctrl-btn toggle-btn" title="リピート">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 2l4 4-4 4"/>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <path d="M7 22l-4-4 4-4"/>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </button>
      </div>
    </section>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <script src="tracks.js"></script>
  <script src="app.js"></script>
</body>
</html>
